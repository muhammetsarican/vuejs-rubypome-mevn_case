services:
  mongo:
    image: mongo:latest
    container_name: rubypome_mongo
    ports:
      - '127.0.0.1:27027:27017'
    networks:
      - rubypome

  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    container_name: rubypome_server
    ports:
      - '4545:4040'
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=rubypome_mongo
      - DB_PORT=27017
    networks:
      - rubypome

  client:
    build:
      context: ./client/
      dockerfile: Dockerfile
    container_name: rubypome_client
    env_file:
      - ./client/.env
    environment:
      - VITE_SERVER_PORT=4545
    ports:
      - '5173:5173'
    networks:
      - rubypome

networks:
  rubypome:
    driver: bridge
