upstream client {
  # Could be host.docker.internal - Docker for Mac/Windows - the host itself
  # Could be your API in a appropriate domain
  # Could be other container in the same network, like container_name:port
  server rubypome_client:4173;
}

upstream server{
  server rubypome_server:4040;
}

server {
  listen 80;
  server_name localhost;

  location / {
    proxy_pass http://client/;

    # Pass only real client IP, block spoofing headers
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Client-IP $remote_addr;
    proxy_set_header Host $host;

    # Forward traffic to Docker Nginx
    proxy_http_version 1.1;
    proxy_set_header Connection "upgrade";
    proxy_set_header Upgrade $http_upgrade;
  }

  location ^~ /api/ { 
    proxy_pass http://server;
  }
}
